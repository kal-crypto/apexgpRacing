# Netlify config — publishes the static game site in the /web folder.
[build]
  publish = "web"
  command = ""

# The bare domain is served as "/", NOT "/index.html", so a rule for the file alone
# leaves the root cacheable and visitors keep seeing an old build after a deploy.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
